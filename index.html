  #vp header span { color: #9aa3ab; }

  #vp label.fila > span:first-child { flex: 0 0 74px; color: #c3c9ce; }
  #vp label.fila > :nth-child(2) { flex: 1; min-width: 0; }
  #vp select, #vp input[type=number] {
    background: #0f1215; color: #e8eaec; border: 1px solid #3b434b; border-radius: 5px; padding: 4px 6px; font: inherit;
  }
  #vp input[type=range] { accent-color: #e5484d; }
  #vp input[type=color] { width: 36px; height: 24px; padding: 0; border: 1px solid #3b434b; border-radius: 4px; background: none; flex: 0 0 auto !important; }

  #vp button {
    flex: 1 1 auto; background: #2a3138; color: #e8eaec; border: 1px solid #3b434b; border-radius: 5px;
    padding: 6px 8px; font: inherit; cursor: pointer;

  #vp .nota { color: #9aa3ab; font-size: 12px; margin: 6px 0 0; }
  #aviso {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 1001; max-width: min(560px, calc(100vw - 30px));
    background: rgba(22, 26, 30, .95); color: #e8eaec; border: 1px solid #333a41; border-radius: 8px; padding: 9px 14px;
    font: 13px/1.4 system-ui, sans-serif; display: none;

<div class="potree_container" style="position:absolute; width:100%; height:100%; left:0; top:0;">
  <div id="potree_render_area">
    <div id="vp">
      <header id="vpCab"><b id="vpTitulo">Visor 3D</b><span id="vpFlecha">▾</span></header>

      <section>
        <h4>Biblioteca de nubes</h4>
        <div id="listaNubes"></div>
        <p class="nota"><a href="#" id="adminLink" style="color:#9aa3ab">Administrar</a></p>
        <div id="admin" style="display:none">
          <button id="adminEntrar" style="width:100%">Iniciar sesión con Google</button>
          <div id="adminSubir" style="display:none">
            <input type="file" id="adminArchivo" accept=".laz,.las" style="width:100%; margin:6px 0">
            <button id="adminEnviar" style="width:100%">Subir a la biblioteca</button>

          <label class="fila"><span>Posición</span><input type="range" id="posCorte" min="0" max="1000" value="500"><span class="valor" id="posVal"></span></label>
          <label class="fila" id="filaAng"><span>Giro</span><input type="range" id="angCorte" min="0" max="180" step="0.5" value="0"><span class="valor" id="angVal">0°</span></label>
          <label class="fila"><span>Grosor (m)</span><input type="number" id="grosorCorte" min="0.005" max="20" step="0.01" value="0.10"></label>

            <option value="baja">Calidad baja (laptop básica)</option>

<script type="module">
import * as THREE from "./libs/three.js/build/three.module.js";

const CFG = window.VISOR_CONFIG || { nubes: [] };
const $id = (x) => document.getElementById(x);
const guardar = (k, v) => { try { localStorage.setItem("visor3d." + k, v); } catch (e) {} };
const leer = (k) => { try { return localStorage.getItem("visor3d." + k); } catch (e) { return null; } };

/* ---------- avisos ---------- */
let tAviso = null;
function aviso(texto, error = false, fijo = false) {
  const el = $id("aviso");
  el.textContent = texto; el.className = error ? "error" : ""; el.style.display = texto ? "block" : "none";
  clearTimeout(tAviso);
  if (texto && !fijo) tAviso = setTimeout(() => (el.style.display = "none"), error ? 15000 : 4000);
}

/* ---------- visor ---------- */
const viewer = new Potree.Viewer($id("potree_render_area"));
window.viewer = viewer;
viewer.setFOV(60);
viewer.setBackground("gradient");
viewer.setMinNodeSize(30);
document.title = CFG.titulo || "Visor 3D";
$id("vpTitulo").textContent = CFG.titulo || "Visor 3D";
$id("vpCab").onclick = () => {
  const c = $id("vp").classList.toggle("cerrado");
  $id("vpFlecha").textContent = c ? "▸" : "▾";
};
if (window.innerWidth < 700) $id("vpCab").onclick();
// que los clics en el panel no lleguen al visor 3D
for (const ev of ["mousedown", "mouseup", "wheel", "dblclick", "touchstart", "pointerdown", "contextmenu", "keydown"])
  $id("vp").addEventListener(ev, (e) => e.stopPropagation());

/* ---------- calidad ---------- */
const CALIDAD = {
  baja:  { puntos:   600_000, edl: false, nodo: 60 },
  media: { puntos: 1_500_000, edl: true,  nodo: 30 },
  alta:  { puntos: 4_000_000, edl: true,  nodo: 15 },
};
function aplicarCalidad(c) {
  const q = CALIDAD[c] || CALIDAD.media;
  viewer.setPointBudget(q.puntos);
  viewer.setEDLEnabled(q.edl);
  viewer.setMinNodeSize(q.nodo);
  $id("calidad").value = c; guardar("calidad", c);
}
const equipoBasico = (navigator.deviceMemory && navigator.deviceMemory <= 4) || window.innerWidth < 700;
aplicarCalidad(leer("calidad") || (equipoBasico ? "baja" : "media"));
$id("calidad").onchange = (e) => aplicarCalidad(e.target.value);

/* ---------- biblioteca de nubes ---------- */
let actual = null; // { id, pc }
const API = "https://www.googleapis.com/drive/v3/files";

function urlDe(n) {
  if (n.url) return n.url;
  return `${API}/${encodeURIComponent(n.driveId)}?alt=media&key=${encodeURIComponent(CFG.driveApiKey)}`;
}

async function comprobar(url) {
  // pide solo los primeros bytes: confirma acceso y lectura por partes
  let r;
  try { r = await fetch(url, { headers: { Range: "bytes=0-1023" } }); }
  catch (e) { throw new Error("No se pudo conectar con el archivo (red o permisos del navegador)."); }
  if (r.status === 206) return;
  if (r.status === 200) throw new Error("El servidor no permite lectura por partes; el archivo no se puede transmitir.");
  if (r.status === 404) throw new Error("Archivo no encontrado o no compartido como «Cualquier persona con el enlace».");
  if (r.status === 403) throw new Error("Acceso denegado (403): revisa la clave de API, su restricción de dominio, o la cuota de descargas de Drive.");
  if (r.status === 400) throw new Error("Clave de API no válida (400).");
  throw new Error("Error " + r.status + " al leer el archivo.");
}

function marcarActiva() {
  document.querySelectorAll("#listaNubes .nube").forEach((b) => b.classList.toggle("activo", !!actual && b.dataset.id === actual.id));
}

async function abrirNube(n) {
  if (actual && actual.id === n.id) return;
  aviso("Cargando «" + n.nombre + "»…", false, true);
  try {
    const url = urlDe(n);
    await comprobar(url);
    const geometry = await new Promise((ok, mal) => {
      Potree.CopcLoader.load(url, (g) => (g ? ok(g) : mal(new Error("No se pudo leer la nube.")))).catch(mal);
    });
    const pc = new Potree.PointCloudOctree(geometry);
    pc.name = n.nombre;
    pc.material.size = 1;
    pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
    pc.material.shape = Potree.PointShape.SQUARE;
    // formatos LAS 7, 8 y 10 traen color; el resto se pinta por altura
    const fmt = geometry.copc && geometry.copc.header ? geometry.copc.header.pointDataRecordFormat : 7;
    pc.material.activeAttributeName = [7, 8, 10].includes(fmt) ? "rgba" : "elevation";
    if (actual) { // cierra la nube anterior
      viewer.scene.scenePointCloud.remove(actual.pc);
      const i = viewer.scene.pointclouds.indexOf(actual.pc);
      if (i >= 0) viewer.scene.pointclouds.splice(i, 1);
      viewer.scene.removeAllMeasurements();
    }
    viewer.scene.addPointCloud(pc);
    actual = { id: n.id, pc };
    viewer.fitToScreen(0.6);
    actualizarCorte(); marcarActiva();
    const u = new URL(location.href); u.searchParams.set("nube", n.id); history.replaceState(null, "", u);
    aviso("");
  } catch (e) {
    console.error(e);
    aviso("«" + n.nombre + "»: " + (e.message || e), true);
  }
}

async function listarDrive() {
  // todas las nubes .copc.laz de la carpeta pública de Drive
  if (!CFG.driveApiKey || !CFG.driveFolderId) return [];
  const q = encodeURIComponent(`'${CFG.driveFolderId}' in parents and trashed = false`);
  const r = await fetch(`${API}?q=${q}&fields=files(id,name,size)&orderBy=name&pageSize=500&key=${encodeURIComponent(CFG.driveApiKey)}`);
  if (!r.ok) throw new Error("No se pudo leer la carpeta de Drive (error " + r.status + "). Revisa la clave y que la carpeta esté compartida por enlace.");
  const j = await r.json();
  return (j.files || []).filter((f) => /\.copc\.laz$/i.test(f.name)).map((f) => ({
    id: f.id, driveId: f.id, nombre: f.name.replace(/\.copc\.laz$/i, "").replace(/[_-]+/g, " "),
    peso: !f.size ? "" : f.size >= 1073741824 ? (f.size / 1073741824).toFixed(1) + " GB" : Math.max(1, Math.round(f.size / 1048576)) + " MB",
  }));
}

let primeraVez = true;
async function cargarBiblioteca() {
  let nubes = [...(CFG.nubes || [])];
  try { nubes = nubes.concat(await listarDrive()); }
  catch (e) { console.error(e); aviso(e.message, true); }
  const lista = $id("listaNubes");
  lista.textContent = "";
  if (!nubes.length) { lista.textContent = "Todavía no hay nubes en la biblioteca."; return; }
  for (const n of nubes) {
    const b = document.createElement("button");
    b.className = "nube"; b.dataset.id = n.id; b.title = n.nombre;
    if (n.peso) { const s = document.createElement("small"); s.textContent = n.peso; b.append(s); }
    b.append(document.createTextNode(n.nombre));
    b.onclick = () => abrirNube(n);
    lista.append(b);
  }
  marcarActiva();
  if (!primeraVez) return;
  primeraVez = false;
  const pedido = new URLSearchParams(location.search).get("nube");
  const ini = nubes.find((n) => n.id === pedido) || (nubes.length === 1 ? nubes[0] : null);
  if (ini) abrirNube(ini);
}
cargarBiblioteca();

/* ---------- administración: subir nubes a Drive (solo el dueño) ---------- */
let token = null;
const carpetaId = () => CFG.driveFolderId || leer("carpeta") || "";
const estado = (t) => ($id("adminEstado").textContent = t);

$id("adminLink").onclick = (e) => {
  e.preventDefault();
  const a = $id("admin"); a.style.display = a.style.display === "none" ? "block" : "none";
  if (!CFG.googleClientId) { estado("Falta configurar el inicio de sesión de Google (googleClientId en config.js)."); $id("adminEntrar").style.display = "none"; return; }
  if (!window.google || !google.accounts) { // precarga para que el clic de inicio de sesión abra la ventana sin bloqueo
    const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; document.head.append(sc);
  }
};

$id("adminEntrar").onclick = () => {
  if (!window.google || !google.accounts) { estado("Cargando inicio de sesión… vuelve a pulsar en un momento."); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: CFG.googleClientId,
    scope: "https://www.googleapis.com/auth/drive.file",
    callback: async (r) => {
      if (!r.access_token) { estado("Inicio de sesión cancelado."); return; }
      token = r.access_token;
      $id("adminEntrar").style.display = "none"; $id("adminSubir").style.display = "block";
      try { await asegurarCarpeta(); } catch (e) { estado(e.message); }
    },
    error_callback: () => estado("Inicio de sesión cancelado."),
  }).requestAccessToken();
};

async function g(url, opciones = {}) {
  const r = await fetch(url, { ...opciones, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opciones.headers || {}) } });
  if (!r.ok) throw new Error("Drive respondió " + r.status + ". Solo la cuenta dueña de la carpeta puede subir.");
  return r;
}

async function asegurarCarpeta() {
  if (carpetaId()) { estado("Sesión iniciada. Elige un archivo .copc.laz."); return; }
  const r = await g(API, { method: "POST", body: JSON.stringify({ name: "Nubes Visor 3D", mimeType: "application/vnd.google-apps.folder" }) });
  const id = (await r.json()).id;
  await g(`${API}/${id}/permissions`, { method: "POST", body: JSON.stringify({ role: "reader", type: "anyone" }) });
  guardar("carpeta", id);
  estado("Carpeta creada en tu Drive. ID: " + id); console.log("CARPETA_ID=" + id);
}

function enviarTrozo(url, trozo, inicio, total, progreso) {
  return new Promise((ok, mal) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    x.setRequestHeader("Content-Range", trozo ? `bytes ${inicio}-${inicio + trozo.size - 1}/${total}` : `bytes */${total}`);
    if (trozo) x.upload.onprogress = (e) => progreso(inicio + e.loaded);
    x.onload = () => ok(x); x.onerror = () => mal(new Error("red"));
    x.send(trozo || null);
  });
}

async function subir(archivo) {
  const r = await g("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable", {
    method: "POST", body: JSON.stringify({ name: archivo.name, parents: [carpetaId()] }),
    headers: { "X-Upload-Content-Length": String(archivo.size) },
  });
  const url = r.headers.get("Location");
  if (!url) throw new Error("Drive no devolvió la dirección de subida.");
  const TROZO = 16 * 1024 * 1024, total = archivo.size, barra = $id("adminProg");
  let pos = 0, fallos = 0;
  barra.style.display = "block";
  const progreso = (b) => { barra.value = b / total; estado("Subiendo… " + ((100 * b) / total).toFixed(1) + " %  (no cierres esta pestaña)"); };
  while (pos < total) {
    let x;
    try { x = await enviarTrozo(url, archivo.slice(pos, Math.min(pos + TROZO, total)), pos, total, progreso); fallos = 0; }
    catch (e) { // corte de red: espera, pregunta a Drive cuánto recibió y continúa
      if (++fallos > 8) throw new Error("Se perdió la conexión demasiadas veces. Vuelve a intentarlo.");
      await new Promise((t) => setTimeout(t, 3000 * fallos));
      try { x = await enviarTrozo(url, null, 0, total); } catch (e2) { continue; }
    }
    if (x.status === 200 || x.status === 201) {
      // verificación: Drive debe tener exactamente el mismo tamaño
      let id = null; try { id = JSON.parse(x.responseText).id; } catch (e) {}
      if (id) {
        const m = await (await g(`${API}/${id}?fields=size`)).json();
        if (String(m.size) !== String(total)) {
          await g(`${API}/${id}`, { method: "DELETE" }).catch(() => {});
          throw new Error("La subida llegó incompleta a Drive y se descartó. Vuelve a intentarlo.");
        }
      }
      pos = total; break;
    }
    if (x.status === 308) {
      const m = /-(\d+)$/.exec(x.getResponseHeader("Range") || "");
      pos = m ? parseInt(m[1]) + 1 : (x.getResponseHeader("Range") === null && fallos === 0 ? Math.min(pos + TROZO, total) : pos);
      continue;
    }
    throw new Error("Drive rechazó la subida (error " + x.status + ").");
  }
}

$id("adminEnviar").onclick = async () => {
  const f = $id("adminArchivo").files[0];
  if (!f) { estado("Elige primero un archivo."); return; }
  if (!/\.copc\.laz$/i.test(f.name)) { estado("Este archivo no está convertido. El visor necesita .copc.laz: convierte tu .las en tu PC y sube el resultado."); return; }
  if (!carpetaId()) { estado("Aún no hay carpeta de biblioteca."); return; }
  $id("adminEnviar").disabled = true;
  try { await subir(f); estado("Listo: «" + f.name + "» ya está en la biblioteca."); await cargarBiblioteca(); }
  catch (e) { console.error(e); estado(e.message); }
  $id("adminEnviar").disabled = false; $id("adminProg").style.display = "none";
};

/* ---------- corte de sección ---------- */
const sec = window.VisorSeccion = { mode: 0, normal: [0, 0, 1], point: [0, 0, 0], thickness: 0.1, color: [1, 0, 0] };
let tipo = "0", lado = 1;

const marco = new THREE.LineLoop(
  new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute([-.5,-.5,0, .5,-.5,0, .5,.5,0, -.5,.5,0], 3)),
  new THREE.LineBasicMaterial({ color: 0xff0000, depthTest: false })
);
marco.visible = false; marco.renderOrder = 10;
viewer.scene.scene.add(marco);

function hexARgb(h) { return [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255); }

function cajaTotal() {
  const bb = viewer.getBoundingBox(viewer.scene.pointclouds);
  return new THREE.Box3(new THREE.Vector3().copy(bb.min), new THREE.Vector3().copy(bb.max));
}

function actualizarCorte() {
  $id("opcCorte").style.display = tipo === "0" ? "none" : "block";
  $id("filaAng").style.display = tipo === "vertical" ? "flex" : "none";
  if (tipo === "0" || !viewer.scene.pointclouds.length) { sec.mode = 0; marco.visible = false; return; }

  const b = cajaTotal(), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const ang = (parseFloat($id("angCorte").value) * Math.PI) / 180;
  const n = tipo === "planta" ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0);
  // recorrido del plano: proyección de la caja sobre la normal
  const medio = (Math.abs(n.x) * s.x + Math.abs(n.y) * s.y + Math.abs(n.z) * s.z) / 2;
  const t = (parseFloat($id("posCorte").value) / 1000 - 0.5) * 2 * medio;
  const p = c.clone().addScaledVector(n, t);

  sec.mode = parseInt($id("modoCorte").value);
  sec.normal = [n.x * lado, n.y * lado, n.z * lado];
  sec.point = [p.x, p.y, p.z];
  sec.thickness = Math.max(0.001, parseFloat($id("grosorCorte").value) || 0.1);
  sec.color = hexARgb($id("colorCorte").value);

  $id("posVal").textContent = tipo === "planta" ? p.z.toFixed(2) + " m" : (t + medio).toFixed(2) + " m";
  $id("angVal").textContent = $id("angCorte").value + "°";

  // marco del plano de corte
  marco.material.color.setRGB(...sec.color);
  marco.position.copy(p);
  if (tipo === "planta") { marco.rotation.set(0, 0, 0); marco.scale.set(s.x, s.y, 1); }
  else {
    const ancho = Math.abs(n.y) * s.x + Math.abs(n.x) * s.y;
    marco.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
      new THREE.Vector3(-n.y, n.x, 0), new THREE.Vector3(0, 0, 1), n));
    marco.scale.set(ancho, s.z, 1);
  }
  marco.visible = true;
}

for (const bt of document.querySelectorAll("#tipoCorte button")) bt.onclick = () => {
  tipo = bt.dataset.t;
  document.querySelectorAll("#tipoCorte button").forEach((x) => x.classList.toggle("activo", x === bt));
  actualizarCorte();
};
for (const idc of ["modoCorte", "posCorte", "angCorte", "grosorCorte", "colorCorte"]) $id(idc).oninput = actualizarCorte;
$id("invertir").onclick = () => { lado = -lado; actualizarCorte(); };
$id("verFrente").onclick = () => {
  if (!sec.mode) return;
  const b = cajaTotal(), r = b.getSize(new THREE.Vector3()).length();
  const p = new THREE.Vector3(...sec.point), n = new THREE.Vector3(...sec.normal);
  const pos = p.clone().addScaledVector(n, r);
  if (tipo === "planta") pos.y -= r * 0.001; // evita la vista exactamente vertical
  ortografica(true);
  viewer.scene.view.setView(pos, p, 400);
};
const c0 = CFG.corte || {};
if (c0.color) $id("colorCorte").value = c0.color;
if (c0.grosor) $id("grosorCorte").value = c0.grosor;

/* ---------- medir ---------- */
const MED = {
  distancia: { showDistances: true, closed: false, name: "Distancia" },
  altura:    { showDistances: false, showHeight: true, showArea: false, closed: false, maxMarkers: 2, name: "Altura" },
  area:      { showDistances: true, showArea: true, closed: true, name: "Área" },
};
for (const bt of document.querySelectorAll("button[data-m]"))
  bt.onclick = () => viewer.measuringTool.startInsertion(MED[bt.dataset.m]);
$id("borrarMed").onclick = () => viewer.scene.removeAllMeasurements();

/* ---------- vista ---------- */
function ortografica(si) {
  viewer.setCameraMode(si ? Potree.CameraMode.ORTHOGRAPHIC : Potree.CameraMode.PERSPECTIVE);
  $id("proyeccion").textContent = si ? "Perspectiva" : "Ortográfica";
  $id("proyeccion").dataset.o = si ? "1" : "";
}
$id("proyeccion").onclick = () => ortografica(!$id("proyeccion").dataset.o);
$id("encuadrar").onclick = () => viewer.fitToScreen(0.6);
</script>
</body>
</html>
